# TTS API Server Configuration
# ElevenLabs-compatible API powered by GLaDOS and Kokoro voices

host: "0.0.0.0"
port: 8000
model_dir: "models/TTS"
default_voice: "af_alloy"
default_model: "kokoro-v1"

# Authentication (optional)
# Set api_key_required to true and provide an api_key to enforce xi-api-key header
api_key: ${TTS_API_KEY}
api_key_required: false

# Limits
max_text_length: 5000
request_timeout_seconds: 60.0

# Logging
log_level: INFO
