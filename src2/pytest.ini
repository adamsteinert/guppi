[pytest]
# pytest configuration for GLaDOS 2.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require models/hardware)
    slow: Slow-running tests
    audio: Tests that produce or play audio
    model: Tests that require ONNX models
    asyncio: Async tests

# Output options
addopts =
    -v
    --tb=short
    --color=yes
    -ra

# Test paths
testpaths = tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(levelname)s | %(message)s

# Coverage (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=glados2 --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
